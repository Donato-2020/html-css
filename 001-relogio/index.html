<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style/style.css">
    <title>Relogio</title>
</head>
<body>
    <div class="container-watch">
        <div class="container-time">
            <div class="card-time">
                <span class="span-time" id="span-hour">00</span>
                <span class="span-desc">Horas</span>
            </div>
            <div class="card-time">
                <span class="span-time" id="span-minu">00</span>
                <span class="span-desc">Minutos</span>
            </div>
            <div class="card-time">
                <span class="span-time" id="span-seco">00</span>
                <span class="span-desc">Segundo</span>
            </div>
        </div>

        <div class="container-date">
            <p>
                <span id="span-week">Quarta-feira</span>,
                <span id="span-day">23</span> de
                <span id="span-mounth">Janeiro</span> de
                <span id="span-year">2034</span>.
            </p>
        </div>
    </div>
    <script src="src/script/script.js"></script>
</body>
</html>
